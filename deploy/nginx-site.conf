# Copy the server block contents into a standard Nginx site or the Baota site config.
# Replace map.example.com with the real domain before enabling this file.
server {
    listen 80;
    listen [::]:80;
    server_name map.example.com;

    root /opt/lvyoumap/current/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|jpg|jpeg|png|webp|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }
}
