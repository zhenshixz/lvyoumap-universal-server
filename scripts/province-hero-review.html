<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>省份头图选择 · Beta</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#20323d;background:#f3f6f7;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:72px;background:#fff;border-bottom:1px solid #dde6e9;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1440px)/2));gap:18px;position:sticky;top:0;z-index:20}.brand{font-weight:760;font-size:19px}.tag{font-size:11px;color:#668184;letter-spacing:1px;margin-bottom:5px}.progress{display:flex;align-items:center;gap:12px}.progressbar{width:180px;height:7px;background:#dce8e5;border-radius:8px;overflow:hidden}.progressbar span{display:block;height:100%;background:#1d7968}.back{color:#17665e;text-decoration:none;padding:9px 12px;border-radius:8px;background:#edf5f2}.layout{max-width:1440px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}.side{background:#fff;border:1px solid #dfe7ea;border-radius:14px;padding:10px;align-self:start;position:sticky;top:92px;max-height:calc(100vh - 112px);overflow:auto}.side button{width:100%;border:0;background:transparent;padding:10px 12px;border-radius:8px;text-align:left;color:#536873;display:flex;justify-content:space-between}.side button:hover{background:#f1f6f4}.side button.active{background:#e5f2ee;color:#17665e;font-weight:700}.side button.done::after{content:'✓';color:#1d7968}.main{min-width:0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}h1{font-size:28px;margin:0 0 7px}.muted{color:#71828c;line-height:1.7}.panel{background:#fff;border:1px solid #dfe7ea;border-radius:14px;padding:18px;margin-bottom:18px}.current{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}.current img{width:210px;height:86px;object-fit:cover;border-radius:10px;background:#e8eef0}.candidate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.candidate{border:2px solid transparent;background:#f7f9fa;border-radius:12px;overflow:hidden;text-align:left;padding:0;color:inherit;position:relative}.candidate:hover{border-color:#9fcfc2}.candidate.selected{border-color:#17665e;box-shadow:0 0 0 2px rgba(23,102,94,.09)}.candidate img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e5ebed}.candidate .body{padding:11px 12px}.candidate strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.candidate small{display:block;color:#72828b;margin-top:6px;line-height:1.55}.candidate .check{position:absolute;top:9px;right:9px;width:25px;height:25px;border-radius:50%;background:#17665e;color:#fff;display:none;align-items:center;justify-content:center}.candidate.selected .check{display:flex}.candidate.failed{opacity:.42}.pill{display:inline-flex;background:#edf4f1;color:#3b6e62;border-radius:6px;padding:4px 7px;font-size:11px;margin-right:5px}.preview-grid{display:grid;grid-template-columns:1fr 1fr 240px;gap:14px;align-items:end}.preview label{display:block;font-size:12px;color:#71828c;margin-bottom:7px}.preview-frame{position:relative;border-radius:10px;overflow:hidden;background:#dfe7e9;border:1px solid #d7e0e4}.preview-frame.desktop,.preview-frame.tablet{aspect-ratio:60/13}.preview-frame.mobile{aspect-ratio:50/13}.preview-frame img{width:100%;height:100%;object-fit:cover;display:block}.preview-frame span{position:absolute;left:10px;bottom:7px;color:#fff;font-weight:700;text-shadow:0 1px 4px #000}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}.sliders label{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;color:#5f737d}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 18px;background:#17665e;color:#fff}.btn.secondary{background:#eaf2ef;color:#17665e}.btn:disabled{opacity:.45;cursor:default}.notice{background:#eaf3f0;color:#3e665c;border:1px solid #d4e5df;border-radius:10px;padding:13px 15px;line-height:1.7;margin-bottom:18px}.error{background:#fff0ed;color:#a64734;padding:13px 15px;border-radius:10px;margin-bottom:16px}.focus-tip{margin:0 0 14px}.empty{text-align:center;padding:60px}.loading{padding:70px;text-align:center}.saved-flash{color:#17665e;font-weight:650}@media(max-width:1050px){.candidate-grid{grid-template-columns:repeat(2,1fr)}.preview-grid{grid-template-columns:1fr}.preview.mobile{max-width:420px}.layout{grid-template-columns:175px minmax(0,1fr)}}@media(max-width:720px){header{height:auto;padding:14px 16px;align-items:flex-start}.progress{flex-wrap:wrap;justify-content:flex-end}.progressbar{width:110px}.layout{display:block;margin-top:14px;padding:0 14px}.side{position:static;display:flex;overflow:auto;max-height:none;margin-bottom:14px;gap:6px}.side button{width:auto;white-space:nowrap}.side button.done::after{margin-left:8px}.candidate-grid{grid-template-columns:1fr}.current{grid-template-columns:1fr}.current img{width:100%;height:110px}.top{display:block}.sliders{grid-template-columns:1fr}.preview-grid{grid-template-columns:1fr}.panel{padding:14px}h1{font-size:24px}}
  </style>
</head>
<body>
  <header>
    <div><div class="tag">BETA / HERO IMAGE REVIEW</div><div class="brand">省份头图选择</div></div>
    <div class="progress"><span id="progressText">载入中…</span><div class="progressbar"><span id="progressBar" style="width:0"></span></div><a class="back" href="/">返回补图工作台</a></div>
  </header>
  <div class="layout">
    <aside class="side" id="provinceList"></aside>
    <main class="main">
      <div id="error" class="error" hidden></div>
      <div id="loading" class="loading">正在整理省份候选图…</div>
      <div id="screen" hidden>
        <div class="top"><div><h1 id="title"></h1><div class="muted">从现有已保留图库中选择代表该省份的横向风景。选择只保存为草稿，不会立即替换产品图片。</div></div><span id="savedFlash" class="saved-flash"></span></div>
        <div class="notice">建议优先选择辨识度高的户外全景；避开售票厅、入口、室内陈列、人物特写和带大面积文字的图片。候选图原始尺寸会在加载后显示。</div>
        <section class="panel current"><img id="currentImage" alt="现有头图"><div><strong>目前正在使用的旧头图</strong><div id="currentMeta" class="muted"></div><div class="muted">仅用于比较，不会自动保留为新选择。</div></div></section>
        <section class="panel"><h2>候选图片</h2><p class="muted focus-tip">点击一张图片选择；图片打不开或尺寸不合适时直接换另一张。</p><div class="candidate-grid" id="candidateGrid"></div></section>
        <section class="panel" id="previewPanel" hidden><h2>三种终端裁切预览</h2><p class="muted">拖动焦点位置，使主要景物在三个宽横幅里都能保留。</p><div class="preview-grid"><div class="preview"><label>桌面</label><div class="preview-frame desktop"><img><span id="desktopLabel"></span></div></div><div class="preview"><label>平板</label><div class="preview-frame tablet"><img><span id="tabletLabel"></span></div></div><div class="preview mobile"><label>手机</label><div class="preview-frame mobile"><img><span id="mobileLabel"></span></div></div></div><div class="sliders"><label>水平焦点<input id="focusX" type="range" min="0" max="100" value="50"><output id="focusXValue">50%</output></label><label>垂直焦点<input id="focusY" type="range" min="0" max="100" value="50"><output id="focusYValue">50%</output></label></div></section>
        <div class="actions"><button class="btn secondary" id="prevButton">上一省</button><button class="btn" id="saveButton" disabled>保存并进入下一省</button><button class="btn secondary" id="nextButton">下一省</button></div>
      </div>
    </main>
  </div>
  <script src="/province-hero-ui.js"></script>
</body>
</html>
