<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景点补图工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#223341;background:#f4f6f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}a{color:#17665e;text-decoration:none}header{background:#fff;border-bottom:1px solid #e2e7ec;padding:22px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:750;font-size:19px}.tag{font-size:11px;letter-spacing:1.2px;color:#6c8587;margin-bottom:6px}nav{display:flex;gap:8px}nav a{padding:10px 17px;border-radius:9px;color:#60717d}nav a.active{background:#e8f3ef;color:#17665e;font-weight:650}main{max-width:1288px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin:0 0 12px;letter-spacing:-.6px}h2{font-size:18px;margin:0}p{color:#667987;line-height:1.8;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.btn{border:0;background:#17665e;color:#fff;padding:12px 23px;border-radius:9px;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.5;cursor:default}.panel{background:white;border:1px solid #e0e7eb;border-radius:14px;overflow:hidden;margin:18px 0}.note{background:#edf4f1;border:1px solid #d5e6dd;padding:14px 18px;border-radius:10px;color:#41665a;line-height:1.8}.error{background:#fff0ed;color:#a64734;padding:14px;border-radius:10px;margin:14px 0}.status{color:#357359}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:#75838f;background:#f9fafb;padding:14px 16px}td{padding:15px 16px;border-top:1px solid #edf0f2;vertical-align:top}td:first-child{min-width:210px}td.linkcell a{white-space:nowrap;flex-shrink:0}td.linkcell{min-width:390px;width:58%}.name{font-weight:650;line-height:1.65}.muted{font-size:12px;color:#87939a;margin-top:5px}input[type=url],input[type=text],select{border:1px solid #d8e0e6;background:white;border-radius:7px;padding:10px;width:100%;color:#334a57}input:focus{outline:2px solid #aed5c9;border-color:#448878}details{font-size:12px;color:#6b808e;margin-top:9px}details label{display:inline-block;margin:10px 8px 0 0;width:45%}details input{margin-top:5px}summary{cursor:pointer}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat{background:#fff;border:1px solid #e0e7eb;padding:20px;border-radius:12px}.stat strong{display:block;font-size:29px;font-weight:650;margin:10px 0 0}.bar{height:7px;background:#e2eae8;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#3e8875;transition:width .4s}.batch-select{max-width:400px}.gallery-item{padding:22px;border-top:1px solid #e7edef}.gallery-item:first-child{border:0}.gallery-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photo{background:#f7f9fa;border:1px solid #e5eaed;border-radius:10px;overflow:hidden}.photo img{width:100%;height:195px;object-fit:contain;display:block;background:#eff2f4}.photo figcaption{padding:11px 13px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#657984}figure{margin:0}.empty{padding:65px 24px;text-align:center}.pill{background:#eff4f2;border-radius:6px;padding:5px 9px;color:#477363;font-size:12px}.source-note{font-size:12px;color:#72828c;line-height:1.8;margin-top:8px}.footer{font-size:12px;color:#819099;padding:25px 0}button.secondary{background:#edf3f1;color:#236a5d} [v-cloak]{display:none}@media(max-width:760px){header{display:block;padding:18px}nav{margin-top:15px}main{margin-top:22px;padding:0 16px}.top{align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(2,1fr)}.photo img{height:160px}h1{font-size:24px}}
.controls{flex-wrap:wrap;justify-content:flex-start}.controls label{white-space:nowrap}.photo:has(input[type=checkbox]:not(:checked)){opacity:.55}</style></head><body><div id="app" v-cloak>
<header><div><div class="tag">BETA / GALLERY PILOT</div><div class="brand">景点补图工作台</div></div><nav><a href="#form" :class="{active:page==='form'}">01 填写清单</a><a href="#progress" :class="{active:page==='progress'}">02 运行进度</a><a href="#preview" :class="{active:page==='preview'}">03 批次预览</a></nav></header>
<main><div v-if="error" class="error">{{error}}</div>
<template v-if="page==='form' && form"><div class="top"><div><h1>自动找图，疑难项再手填</h1><p>生成清单 → 自动搜索并采集 → 预览；剩余项可手填链接。</p></div><div style="text-align:right;max-width:420px"><button class="btn" @click="save" :disabled="saving||busy||form.readOnly">{{saving?'保存中…':(!dirty&&form.savedAt?'✓ 已保存 · 再次保存':'保存并确认链接')}}</button><p role="status" aria-live="polite" class="status" style="margin-top:8px">{{saving?'正在保存，请稍候…':dirty?'有修改尚未保存':form.savedAt?'✓ '+filled+' 个链接已保存并确认，可启动采集。':''}}<br v-if="form.savedAt&&!dirty"><span class="muted" v-if="form.savedAt&&!dirty">保存时间：{{time(form.savedAt)}}</span></p></div></div>
<div class="panel"><div class="toolbar controls"><label>新清单条数 <input type="number" min="1" max="100" v-model.number="count" style="width:85px;padding:9px;border:1px solid #d8e0e6;border-radius:7px"></label><span class="pill">待补景点 · 自动分流</span><button class="btn secondary" @click="generate" :disabled="busy||saving||dirty||form.readOnly">生成待补清单</button><button class="btn" @click="start(true)" :disabled="busy||saving||dirty||form.readOnly">自动搜索并采集 / 续跑</button><button class="btn secondary" @click="start(false)" :disabled="busy||saving||dirty||!form.savedAt||form.readOnly">{{busy?'处理中…':'仅按手填链接采集 / 续跑'}}</button></div><div class="toolbar controls" v-if="drafts.length"><select v-model="historyId" style="max-width:480px"><option value="">选择历史清单（已填写地址会保留）</option><option v-for="d in drafts" :value="d.id">{{time(d.createdAt||d.savedAt)}} · {{d.count}}项 · {{d.savedAt?'已保存':'未确认'}}</option></select><button class="btn secondary" @click="restore" :disabled="busy||dirty||!historyId||form.readOnly">打开清单</button></div></div>
<p class="muted" v-if="form.items.length>activeFormItems.length">{{form.items.length-activeFormItems.length}}项已确认图源无图，已关闭补图并从填写列表隐藏。</p><div class="note">自动队列优先未尝试景点，再处理网络异常。已成功取图但无合格图片的同一链接不重跑；没有同城市页面的留给人工换链接；规则更新后可重新评估旧的尺寸拒绝项。<br>已填写 {{filled}} / {{form.items.length}} 个地址。你点击“保存清单”即表示这些 Trip 页面已人工确认，程序不会再因名称前缀或景区范围拦截。自动模式会搜索空地址项，按搜索顺序选同城市第一项采集，并记录选择依据；仅手填模式的空地址不搜索。勾选“跳过”则本项不采集。保存不会启动任务。<br>图片原始宽度须大于540像素，保留过暗和重复检查。Trip 最多取 5 张页面图库图，有几张合格图就保留几张。<template v-if="form.sourcePolicy?.amapDisabled"><br><b>高德当前停用：</b>{{form.sourcePolicy.amapReason}}；停用期不会发起高德请求，到期自动恢复。</template></div>
<div class="panel"><div class="toolbar"><span>待处理清单 <span class="muted">{{activeFormItems.length}} ITEMS</span></span><span class="status">{{message|| (form.savedAt?'上次保存：'+time(form.savedAt):'预填内容尚未保存确认')}}</span></div><div class="tablewrap"><table><thead><tr><th>景点 / 地域</th><th>Trip 详情页地址</th><th>历史隔离候选</th><th>本轮跳过</th></tr></thead><tbody><tr v-for="item in activeFormItems" :key="item.id"><td><div class="name">{{item.name}}</div><div class="muted">{{item.province}} · {{item.city}}</div><div class="muted" v-if="item.discoveryReason">{{item.discoveryReason}}</div></td><td class="linkcell"><div style="display:flex;gap:9px;align-items:center"><input type="url" v-model="item.url" @input="dirty=true" placeholder="https://hk.trip.com/travel-guide/attraction/…" :disabled="form.readOnly"><a v-if="safeUrl(item.url)" :href="item.url" target="_blank" rel="noopener">核对</a></div><div class="note" style="margin-top:8px;padding:8px" v-if="item.autoSelection&&!item.url&&!item.skip">自动采集将使用：<a :href="item.autoSelection.url" target="_blank" rel="noopener">{{item.autoSelection.name}}</a> · {{item.autoSelection.region}}<br><span class="muted">同城市首项，原搜索排名 {{item.autoSelection.selectedRank}}；无需填写或保存链接。</span></div><details v-if="item.discoveryCandidates?.length"><summary>{{item.autoSelection&&!item.url&&!item.skip?'搜索记录（已自动选择，无需手选）':'搜索找到的页面（可手动更换）'}}</summary><p v-for="c in item.discoveryCandidates"><a :href="c.url" target="_blank" rel="noopener">{{c.name}} · {{c.region}}</a> <button class="btn secondary" style="padding:4px 8px" @click="item.url=c.url;dirty=true" :disabled="form.readOnly" v-if="!item.autoSelection||item.url">填入</button></p></details></td><td>{{item.beforeSelected}} 张</td><td><input type="checkbox" v-model="item.skip" @change="dirty=true" :disabled="form.readOnly"></td></tr></tbody></table></div></div><p v-if="dirty" class="status">有尚未保存的修改。</p><p v-if="form.readOnly">局域网只读。请在运行服务的电脑上打开本机地址保存。</p></template>
<template v-else><div class="top"><div><h1>{{page==='progress'?'把重复工作交给程序':'每一批，都单独验收'}}</h1><p>{{page==='progress'?'每 3 秒刷新。关闭网页不影响后台采集；请保持电脑唤醒。':'按启动时间区分批次。点击写入即代表验收通过，暂时不再补图。'}}</p></div><select class="batch-select" v-model="selected" @change="loadBatch"><option value="">选择批次</option><option v-for="b in batches" :value="b.id">{{b.id}} · {{statusText(b.status)}}</option></select></div>
<div v-if="!batch" class="panel empty"><h2>还没有批次</h2><p>保存清单后，在清单页点击“启动采集”。</p></div>
<template v-else><div class="stats"><div class="stat">当前状态<strong style="font-size:23px">{{statusText(batch.apply?.status==='applied'||applying?batch.apply.status:batch.status)}}</strong></div><div class="stat">处理进度<strong>{{done}} <small style="font-size:15px;color:#85949c">/ {{batch.items.length}}</small></strong></div><div class="stat">{{applied?'已验收候选':'合格候选'}}<strong>{{candidateCount}}</strong></div><div class="stat">有候选的景点<strong>{{batch.items.filter(x=>x.images.some(y=>y.accepted)).length}}</strong></div></div><div class="bar"><span :style="{width:(done/batch.items.length*100)+'%'}"></span></div><p>{{batch.current?((batch.current.name||'')+' · '+batch.current.phase):'处理结束，可检查下方结果'}} <span class="muted">更新于 {{time(batch.heartbeatAt)}}</span></p><div v-if="batch.status==='interrupted'" class="error">任务已中断。{{batch.error}} 保持清单不变，在清单页点击“启动采集”可续跑。</div>
<div class="note" v-if="batch.status==='completed'"><button class="btn secondary" @click="remaining" :disabled="busy||batch.readOnly" v-if="batch.items.some(i=>!i.skip&&!i.trip?.noImageConfirmed&&!i.images.some(im=>im.accepted))">将本批无图项转为手填清单</button><br><template v-if="applied">已于 {{time(batch.apply.appliedAt)}} 写入 Beta：{{batch.apply.count}} 个景点、{{batch.apply.imageCount}} 张图。这些景点暂时不再进入新清单。</template><template v-else>每个景点可新增1–5张，已有图自动保留且不计入此限额；点击写入即表示已验收、暂时无需补图。0张项目保留原有图片。<br><a href="#preview" v-if="page==='progress'">打开批次预览并写入 →</a><div v-if="page==='preview'" class="toolbar controls" style="padding:12px 0 0"><button class="btn" @click="applyBatch" :disabled="busy||applying||batch.readOnly||!selectedItems.length">{{applying?'正在写入与构建…':(batch.apply?.status==='interrupted'?'恢复写入 Beta':'写入 Beta：'+selectedItems.length+'个景点 / '+selectedCount+'张图')}}</button><span>旧图自动保留，默认沿用原封面；新旧图均可设为封面。</span></div></template></div><div class="error" v-if="batch.apply?.error">{{batch.apply.error}} {{batch.apply.rolledBack?'已恢复写入前的数据，可重试。':''}}</div>
<div class="panel" v-if="page==='progress'"><table><thead><tr><th>景点</th><th>Trip</th><th>高德首图</th><th>处理结果</th></tr></thead><tbody><tr v-for="i in batch.items"><td>{{i.name}}</td><td>{{sourceText(i.trip)}}<div class="muted" v-if="i.discovery">自动发现：{{i.discovery.name||i.discovery.reason}}<span v-if="i.discovery.selectionRule"> · 同城市第{{i.discovery.selectedRank}}项 · {{i.discovery.region}} · {{i.discovery.nameMatch?'同名':'名称不同，已记录'}}</span></div></td><td>{{sourceText(i.amap)}}</td><td>{{itemResult(i)}}</td></tr></tbody></table></div>
<div v-else class="panel"><section class="gallery-item" v-for="i in batch.items"><div class="gallery-head"><div><h2>{{i.name}}</h2><div class="muted">{{i.province}} · {{i.city}} <a v-if="i.url" :href="i.url" target="_blank" rel="noopener">查看 Trip 来源页 ↗</a></div></div><span class="pill">{{itemResult(i)}}</span></div><div v-if="oldImages(i).length"><h3 style="font-size:14px">已有图片 · 自动保留，不会被本次补图覆盖</h3><div class="photos"><figure class="photo" v-for="im in oldImages(i)"><img :src="im.url" loading="lazy" :alt="i.name+' 已有图'"><figcaption><span>已有图 · 保留</span><span v-if="im.url===i.existingCover">当前封面</span></figcaption><div class="toolbar" v-if="!applied"><label><input type="radio" :name="'cover-'+i.id" :value="im.url" v-model="covers[i.id]" @change="persistChoices" :disabled="applying||batch.readOnly"> 设为封面</label></div></figure></div></div><h3 style="font-size:14px">{{applied?'本批验收通过的新图':'本批新图 · 勾选后追加'}}</h3><div class="photos"><figure class="photo" v-for="im in displayImages(i)"><a :href="media(im.file)" target="_blank"><img :src="media(im.thumb)" loading="lazy" :alt="i.name+' '+im.source"></a><figcaption><span>本批新图 · {{im.source==='trip'?'Trip 页面图库':'高德第一张'}}</span><span>{{im.dimensions.join(' × ')}}</span></figcaption><div class="toolbar" style="padding:8px 12px" v-if="!applied"><label><input type="checkbox" v-model="choices[i.id+'|'+im.url]" @change="persistChoices" :disabled="applying||batch.readOnly"> 写入此图</label><label><input type="radio" :name="'cover-'+i.id" :value="im.url" v-model="covers[i.id]" @change="persistChoices" :disabled="applying||batch.readOnly||!choices[i.id+'|'+im.url]"> 设为封面</label></div></figure></div><p v-if="!displayImages(i).length">本项暂无可展示的入选图片。</p><div class="source-note">Trip：{{sourceText(i.trip)}}　高德：{{sourceText(i.amap)}}</div><details v-if="i.images.some(x=>!x.accepted)"><summary>查看下载或筛选未通过原因</summary><p v-for="im in i.images.filter(x=>!x.accepted)">{{im.source}} #{{im.index}}：{{im.reason||'待处理'}}</p></details></section></div></template></template><div class="footer">仅 beta · 本地程序执行，无需对话模型 · 批次保存清单快照，后续编辑不会改变已启动的任务</div></main></div><script src="/vue.js"></script><script src="/ui.js"></script></body></html>
